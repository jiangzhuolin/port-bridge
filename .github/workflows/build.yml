name: Flutter desktop checks and packages
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2022
            arch: x86_64
          - runner: windows-11-arm
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
          - runner: macos-15
            arch: arm64
          - runner: ubuntu-22.04
            arch: x86_64
          - runner: ubuntu-22.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libayatana-appindicator3-dev libglib2.0-bin liblzma-dev libstdc++-12-dev xvfb xauth fonts-noto-cjk
      # Linux ARM64 has no preassembled stable SDK archive. Bootstrap native Dart.
      - name: Install pinned Flutter source
        uses: actions/checkout@v4
        with:
          repository: flutter/flutter
          ref: 3.47.2
          path: build/flutter-sdk
      - name: Add Flutter to PATH (Unix)
        if: runner.os != 'Windows'
        run: echo "$GITHUB_WORKSPACE/build/flutter-sdk/bin" >> "$GITHUB_PATH"
      - name: Add Flutter to PATH (Windows)
        if: runner.os == 'Windows'
        run: Add-Content -LiteralPath $env:GITHUB_PATH -Value "$env:GITHUB_WORKSPACE\build\flutter-sdk\bin"
      - run: flutter --version
      - run: flutter config --no-analytics
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test tool
      - run: flutter analyze
      - run: flutter test
      - name: Build native distribution
        run: dart run tool/build.dart --target-arch ${{ matrix.arch }}
      - name: Linux native integration test
        if: runner.os == 'Linux'
        run: xvfb-run -a dart run tool/verify_desktop.dart build/linux/*/release/bundle/port_bridge
      - name: Windows portable directory integration test
        if: runner.os == 'Windows'
        run: |
          $app = Get-Item -Path dist/port-bridge-*-windows-*/port_bridge.exe
          dart run tool/verify_desktop.dart $app.FullName
      - name: Windows window and tray integration test
        if: runner.os == 'Windows'
        run: |
          $desktop = Get-Process explorer -ErrorAction SilentlyContinue | Where-Object SessionId -EQ (Get-Process -Id $PID).SessionId
          if ($desktop) {
            $app = Get-Item -Path dist/port-bridge-*-windows-*/port_bridge.exe
            ./tool/verify_window_behavior.ps1 -Executable $app.FullName
          } else {
            Write-Output 'No interactive Explorer tray in this session; window/tray test requires a desktop.'
          }
      - name: macOS native integration test
        if: runner.os == 'macOS'
        run: dart run tool/verify_desktop.dart build/macos/Build/Products/Release/*.app/Contents/MacOS/port_bridge
      - uses: actions/upload-artifact@v4
        with:
          name: port-bridge-${{ runner.os }}-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error
